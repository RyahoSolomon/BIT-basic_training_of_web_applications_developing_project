<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>主页</title>
    <script src="../shared/scripts/profile.js"></script>
    <script src="../shared/scripts/preferences.js"></script>
    <script src="../shared/scripts/progress.js"></script>
    <script src="../shared/scripts/settings.js"></script>
    <link rel="stylesheet" href="../shared/styles/menu.css">
    <link rel="stylesheet" href="../shared/styles/settings.css">
    <link rel="stylesheet" href="../shared/styles/player-name-entry.css">
    <script src="../shared/scripts/player-name-entry.js" defer></script>
    <script>
        function construct() {
            GameNameEntry.open();
            return false;
        }
        function load() {
            try {
                GameProgress.restoreAuto();
                window.location.href = "../map/index.html";
            } catch (error) {
                alert(error.message);
            }
            return false;
        }
    </script>
    <script src="../shared/scripts/audio.js"></script>
</head>
<body>
    <audio id="audioPlayer" loop preload="auto" src="../assets/audio/example.mp3"></audio>
    <header class="header">
        <img src="../assets/images/logo.png" alt="源神">
    </header>
    <nav class="index-button-group" aria-label="主菜单">
        <div class="index-button">
            <img src="../assets/images/button.png" alt="">
            <a href="../story/chapter-0/background.html" onclick="return construct()">开始</a>
        </div>
        <div class="index-button">
            <img src="../assets/images/button.png" alt="">
            <a href="#" onclick="return load()">继续</a>
        </div>
        <div class="index-button">
            <img src="../assets/images/button.png" alt="">
            <a href="achievements.html">成就</a>
        </div>
    </nav>
    <div class="button-group" data-settings-host></div>
    <dialog id="player-name-dialog" aria-label="输入主角名字">
        <form id="player-name-form" novalidate>
            <div class="player-name-frame">
                <div class="player-name-row">
                    <input id="player-name" name="playerName" type="text" maxlength="64" required
                        autocomplete="off" spellcheck="false" autocapitalize="off"
                        placeholder="请输入主角名字..." aria-label="主角名字" aria-describedby="player-name-error" autofocus>
                    <output id="player-name-count" for="player-name" aria-live="polite">0/14</output>
                    <button type="button" data-name-close title="取消" aria-label="取消输入名字">
                        <img src="../assets/images/close.png" alt="" draggable="false">
                    </button>
                    <button type="submit" data-name-confirm title="确认" aria-label="确认名字并开始游戏" disabled>
                        <img src="../assets/images/confirm.png" alt="" draggable="false">
                    </button>
                </div>
            </div>
            <p id="player-name-error" role="status" aria-live="polite"></p>
        </form>
    </dialog>
</body>
</html>
