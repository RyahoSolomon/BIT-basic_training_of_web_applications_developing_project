<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>主页</title>
    <script src="../shared/scripts/profile.js"></script>
    <script src="../shared/scripts/preferences.js"></script>
    <script src="../shared/scripts/progress.js"></script>
    <script src="menu-backgrounds.js"></script>
    <script src="../shared/scripts/menu-background.js"></script>
    <script src="../shared/scripts/settings.js"></script>
    <link rel="stylesheet" href="../shared/styles/menu.css">
    <link rel="stylesheet" href="../shared/styles/settings.css">
    <script src="../shared/scripts/player-name-entry.js" defer></script>
    <script>
        function construct() {
            document.getElementById('continue-error').textContent = '';
            GameNameEntry.open();
            return false;
        }
        function load() {
            try {
                GameProgress.restoreAuto();
                window.location.href = "../map/index.html";
            } catch (error) {
                document.getElementById('continue-error').textContent = error.message;
            }
            return false;
        }
    </script>
    <script src="../shared/scripts/audio.js"></script>
</head>
<body>
    <audio id="audioPlayer" loop preload="auto" src="../assets/audio/example.mp3"></audio>
    <header class="header">
        <img src="../assets/images/logo.png" alt="源神">
    </header>
    <nav class="index-button-group" aria-label="主菜单">
        <div class="index-button">
            <a href="../story/chapter-0/background.html" onclick="return construct()">开始</a>
        </div>
        <div class="continue-entry">
            <button type="button" id="continue-game" class="index-button" aria-describedby="continue-hint" onclick="load()" disabled><span>继续</span></button>
            <div id="continue-hint" role="tooltip">
                <span id="continue-summary"></span>
                <small id="continue-saved-at"></small>
            </div>
        </div>
        <div class="index-button">
            <a href="achievements.html">成就</a>
        </div>
    </nav>
    <p id="continue-error" role="alert"></p>
    <div class="button-group" data-settings-host data-settings-context="menu"></div>
</body>
</html>
