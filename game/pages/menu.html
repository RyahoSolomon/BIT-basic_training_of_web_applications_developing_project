<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>主页</title>
    <script src="../shared/scripts/profile.js"></script>
    <script src="../shared/scripts/preferences.js"></script>
    <script src="../shared/scripts/progress.js"></script>
    <script src="../shared/scripts/settings.js"></script>
    <link rel="stylesheet" href="../shared/styles/menu.css">
    <link rel="stylesheet" href="../shared/styles/settings.css">
    <script>
        function construct() {
            try {
                GameProgress.newGame();
                return true;
            } catch (error) {
                alert(error.message);
                return false;
            }
        }
        function load() {
            try {
                GameProgress.restoreAuto();
                window.location.href = "../map/index.html";
            } catch (error) {
                alert(error.message);
            }
            return false;
        }
    </script>
    <script src="../shared/scripts/audio.js"></script>
</head>
<body>
    <audio id="audioPlayer" loop preload="auto" src="../assets/audio/example.mp3"></audio>
    <header class="header">
        <img src="../assets/images/logo.png" alt="源神">
    </header>
    <nav class="index-button-group" aria-label="主菜单">
        <div class="index-button">
            <img src="../assets/images/button.png" alt="">
            <a href="../story/chapter-0/background.html" onclick="return construct()">开始</a>
        </div>
        <div class="index-button">
            <img src="../assets/images/button.png" alt="">
            <a href="#" onclick="return load()">继续</a>
        </div>
        <div class="index-button">
            <img src="../assets/images/button.png" alt="">
            <a href="achievements.html">成就</a>
        </div>
    </nav>
    <div class="button-group" data-settings-host></div>
</body>
</html>
